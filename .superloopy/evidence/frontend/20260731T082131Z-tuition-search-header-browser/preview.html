<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수강료 검색 헤더 QA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf3ef; color: #172b3b; font-family: Arial, "Noto Sans KR", sans-serif; letter-spacing: 0; }
    button, input, select { font: inherit; letter-spacing: 0; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 180px minmax(0, 1fr); }
    .rail { padding: 24px 16px; background: #063c31; color: #fff; }
    .rail h1 { margin: 0 0 8px; font-size: 23px; }
    .rail p { margin: 0; color: #bcd6ce; font-size: 12px; line-height: 1.6; }
    .main { min-width: 0; padding: 24px; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 20px; border: 1px solid #d7e5dc; border-radius: 8px; background: #fff; }
    .head { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 14px; }
    .head h2 { margin: 0 0 5px; font-size: 26px; }
    .head p { margin: 0; color: #607082; font-size: 13px; font-weight: 700; }
    .sync { color: #557084; font-size: 11px; font-weight: 800; text-align: right; }
    .topbar {
      display: grid; grid-template-columns: minmax(220px, 340px) minmax(0, 1fr) auto;
      gap: 10px; align-items: center; padding: 11px 12px; border: 1px solid #dbe7df; border-radius: 8px; background: #fff;
    }
    .month-browser { grid-column: 1 / -1; display: grid; gap: 9px; padding-bottom: 11px; border-bottom: 1px solid #dce8e1; }
    .month-head { display: grid; grid-template-columns: minmax(76px,.34fr) auto minmax(260px,1.66fr) 42px; align-items: center; gap: 10px; }
    .month-label { color: #284056; font-size: 13px; font-weight: 900; }
    .year-nav { display: grid; grid-template-columns: 40px 84px 40px; align-items: center; gap: 4px; }
    .year-nav strong { text-align: center; font-size: 15px; font-weight: 900; }
    .year-btn, .create {
      width: 40px; height: 40px; border: 1px solid #cbded4; border-radius: 8px; background: #fff; color: #31566c; font-weight: 900;
    }
    .create { width: 42px; height: 42px; background: #f6fbf8; color: #0d684d; border-color: #bdd8cb; font-size: 20px; }
    .search {
      min-width: 0; height: 44px; display: grid; grid-template-columns: 20px minmax(0,1fr) 34px; align-items: center; gap: 7px;
      padding: 0 6px 0 11px; border: 2px solid #238b68; border-radius: 8px; background: #fff;
      box-shadow: inset 0 0 0 1px rgba(35,139,104,.08);
    }
    .search-icon { color: #087455; font-size: 17px; font-weight: 900; }
    .search input { min-width: 0; width: 100%; height: 38px; border: 0; outline: 0; color: #18364b; font-size: 14px; font-weight: 800; }
    .search input::placeholder { color: #71847a; opacity: 1; }
    .clear { width: 32px; height: 32px; border: 0; border-radius: 6px; background: #eaf6f0; color: #087455; font-weight: 900; }
    .months { display: grid; grid-template-columns: repeat(12,minmax(52px,1fr)); gap: 6px; }
    .month { min-height: 42px; border: 1px solid #cbded4; border-radius: 8px; background: #f7fbf9; color: #264b5f; font-size: 13px; font-weight: 900; }
    .month.selected { border-color: #087455; background: #087455; color: #fff; box-shadow: 0 5px 12px rgba(8,116,85,.18); }
    .month.off { border-color: #e1e6e3; background: #f2f4f3; color: #a2aaa6; }
    .field { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: 10px; }
    .field label { font-size: 13px; font-weight: 900; }
    .field select { height: 46px; border: 1px solid #ccdcd3; border-radius: 8px; padding: 0 12px; background: #fff; font-weight: 800; }
    .refresh { grid-column: 3; height: 46px; border: 0; border-radius: 8px; padding: 0 16px; background: #087455; color: #fff; font-weight: 900; }
    .metrics { display: grid; grid-template-columns: repeat(5,1fr); margin-top: 14px; border: 1px solid #d7e5dc; border-radius: 8px; overflow: hidden; }
    .metric { min-height: 112px; padding: 20px; border-right: 1px solid #e2ebe6; }
    .metric:last-child { border-right: 0; }
    .metric span { display: block; color: #61736a; font-size: 11px; font-weight: 800; }
    .metric strong { display: block; margin-top: 8px; font-size: 23px; font-variant-numeric: tabular-nums; }
    @media (max-width: 920px) {
      .app { grid-template-columns: 1fr; }
      .rail { display: none; }
      .main { padding: 14px; }
      .month-head { grid-template-columns: minmax(76px,1fr) auto 42px; }
      .search { grid-column: 1 / -1; grid-row: 2; }
      .months { grid-template-columns: repeat(6,minmax(52px,1fr)); }
      .metrics { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail"><h1>수강료 정산</h1><p>학생 수강료 현황, 수납 기록, 안내 대상을 한 화면에서 관리합니다.</p></aside>
    <main class="main">
      <section class="shell">
        <header class="head">
          <div><h2>수강료 정산</h2><p>월별 안내금액, 납부 대조, 미납 연락까지 한 화면에서 정리합니다.</p></div>
          <div class="sync">마지막 동기화는 새로고침 시점 기준입니다.<br>student 탭 기준</div>
        </header>
        <section class="topbar">
          <div class="month-browser">
            <div class="month-head">
              <span class="month-label">수강료 월</span>
              <div class="year-nav"><button class="year-btn">‹</button><strong>2026년</strong><button class="year-btn">›</button></div>
              <div class="search"><span class="search-icon">⌕</span><input value="김가은" aria-label="학생 검색"><button class="clear">×</button></div>
              <button class="create" title="다음 달 수강료 정산 시작">＋</button>
            </div>
            <div class="months">
              <button class="month off">1월</button><button class="month off">2월</button><button class="month off">3월</button>
              <button class="month off">4월</button><button class="month off">5월</button><button class="month">6월</button>
              <button class="month">7월</button><button class="month selected">8월</button><button class="month off">9월</button>
              <button class="month off">10월</button><button class="month off">11월</button><button class="month off">12월</button>
            </div>
          </div>
          <div class="field"><label>미납 상태</label><select><option>전체</option></select></div>
          <button class="refresh">수강료 데이터 새로고침</button>
        </section>
        <section class="metrics">
          <div class="metric"><span>전체 재원생</span><strong>1명</strong></div>
          <div class="metric"><span>납부완료</span><strong>1명</strong></div>
          <div class="metric"><span>미납 학생</span><strong>0명</strong></div>
          <div class="metric"><span>안내 금액 합계</span><strong>662,500원</strong></div>
          <div class="metric"><span>순수 수납액</span><strong>662,500원</strong></div>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
